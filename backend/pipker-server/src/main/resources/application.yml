# @file application.yml
# @project Pipker Framework
# @module Pipker Server
# @description 定义 Server 的公共运行时配置、默认环境和基础配置导入入口。
# @logic 无显式 Profile 时使用 dev + sqlite；公共配置导入 base，环境配置由 Spring Profile 文件继续导入。
# @dependencies Spring Boot、Liquibase、Pipker Sa-Token Starter、Pipker Security Starter
# @index_tags server、配置、profile、liquibase、sa-token、安全、加密
# @author holic512
spring:
  application:
    name: pipker-server
  profiles:
    default: dev,sqlite
  config:
    import: classpath:/config/base/application.yml
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
  is-print: false

pipker:
  security:
    auth:
      session-store: memory
      protected-paths:
        - /api/**
      public-routes:
        - GET /api/ping
        - POST /api/auth/login
        - GET /api/_dev/routes
    crypto:
      password:
        algorithm: bcrypt
        bcrypt-strength: 12
        pbkdf2-iterations: 600000
        pbkdf2-salt-length: 16
        pbkdf2-hash-width: 256
      encryption:
        algorithm: aes-gcm
        aes-gcm-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        rsa-oaep-public-key:
        rsa-oaep-private-key:
  dev:
    route-manifest:
      enabled: false
