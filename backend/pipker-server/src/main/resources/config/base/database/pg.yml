# @file config/base/database/pg.yml
# @project Pipker Framework
# @module Pipker Server
# @description PostgreSQL 数据源配置。
# @logic 仅在 pg Profile 下生效，连接参数由外部环境变量提供，并加载跨数据库共享的 Liquibase XML 基线。
# @dependencies Spring Boot JDBC、PostgreSQL JDBC、Liquibase
# @index_tags server、配置、base、pg、postgresql、datasource、liquibase
# @author holic512
spring:
  config:
    activate:
      on-profile: pg
  datasource:
    url: ${PIPKER_DATABASE_URL:}
    username: ${PIPKER_DATABASE_USERNAME:}
    password: ${PIPKER_DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
