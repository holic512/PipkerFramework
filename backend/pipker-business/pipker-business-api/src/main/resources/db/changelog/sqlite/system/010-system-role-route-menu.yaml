# @file db/changelog/sqlite/system/010-system-role-route-menu.yaml
# @project Pipker Framework
# @module Pipker Business API
# @description SQLite migration that makes role-menu assignments the sole page-route authorization source.
# @logic Rebuilds PAGE-dependent tables without PAGE metadata, restores system_role_menu, then seeds the role-route management API and menu.
# @dependencies Liquibase, SQLite, system_permission, system_menu, system_role_menu, system_api_resource
# @index_tags liquibase, sqlite, rbac, role-menu, route
# @author holic512
databaseChangeLog:
  - changeSet:
      id: 010-system-role-route-menu-sqlite
      author: holic512
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              PRAGMA foreign_keys = OFF;

              DELETE FROM system_role_permission
              WHERE permission_id IN (
                SELECT id FROM system_permission WHERE permission_type = 'PAGE'
              );

              CREATE TABLE system_permission_replacement (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                permission_code VARCHAR(128) NOT NULL,
                permission_name VARCHAR(100) NOT NULL,
                permission_type VARCHAR(16) NOT NULL,
                description VARCHAR(500),
                status VARCHAR(16) NOT NULL DEFAULT 'ENABLED',
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL,
                CONSTRAINT uk_system_permission_code UNIQUE (permission_code),
                CONSTRAINT ck_system_permission_type CHECK (permission_type = 'API')
              );

              INSERT INTO system_permission_replacement (
                id, permission_code, permission_name, permission_type, description, status, created_at, updated_at
              )
              SELECT id, permission_code, permission_name, permission_type, description, status, created_at, updated_at
              FROM system_permission
              WHERE permission_type = 'API';

              CREATE TABLE system_menu_replacement (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                parent_id BIGINT,
                menu_name VARCHAR(100) NOT NULL,
                menu_type VARCHAR(16) NOT NULL,
                route_path VARCHAR(255),
                route_name VARCHAR(100),
                component_key VARCHAR(255),
                icon VARCHAR(100),
                sort INT NOT NULL DEFAULT 0,
                visible BOOLEAN NOT NULL DEFAULT 1,
                status VARCHAR(16) NOT NULL DEFAULT 'ENABLED',
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL,
                CONSTRAINT uk_system_menu_route_path UNIQUE (route_path),
                CONSTRAINT uk_system_menu_route_name UNIQUE (route_name),
                CONSTRAINT ck_system_menu_type CHECK (menu_type IN ('DIRECTORY', 'MENU')),
                CONSTRAINT fk_system_menu_parent FOREIGN KEY (parent_id)
                  REFERENCES system_menu (id) ON DELETE CASCADE
              );

              INSERT INTO system_menu_replacement (
                id, parent_id, menu_name, menu_type, route_path, route_name, component_key, icon,
                sort, visible, status, created_at, updated_at
              )
              SELECT id, parent_id, menu_name, menu_type, route_path, route_name, component_key, icon,
                     sort, visible, status, created_at, updated_at
              FROM system_menu
              WHERE menu_type IN ('DIRECTORY', 'MENU');

              DROP TABLE system_menu;
              ALTER TABLE system_menu_replacement RENAME TO system_menu;

              DROP TABLE system_permission;
              ALTER TABLE system_permission_replacement RENAME TO system_permission;

              CREATE INDEX idx_system_menu_parent_id ON system_menu (parent_id);

              CREATE TABLE system_role_menu (
                role_id BIGINT NOT NULL,
                menu_id BIGINT NOT NULL,
                CONSTRAINT pk_system_role_menu PRIMARY KEY (role_id, menu_id),
                CONSTRAINT fk_system_role_menu_role FOREIGN KEY (role_id)
                  REFERENCES system_role (id) ON DELETE CASCADE,
                CONSTRAINT fk_system_role_menu_menu FOREIGN KEY (menu_id)
                  REFERENCES system_menu (id) ON DELETE CASCADE
              );

              CREATE INDEX idx_system_role_menu_menu_id ON system_role_menu (menu_id);

              INSERT OR IGNORE INTO system_permission (permission_code, permission_name, permission_type, description, status, created_at, updated_at)
              VALUES ('system:role-menu:manage', '管理角色路由菜单', 'API', '读取和保存角色可访问页面菜单', 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);

              INSERT OR IGNORE INTO system_menu (
                parent_id, menu_name, menu_type, route_path, route_name, component_key, icon, sort, visible, status, created_at, updated_at
              )
              SELECT id, '角色路由', 'MENU', '/system/role-menu', 'SystemRoleMenu', 'system/role-menu/index', 'Share', 20, 1, 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM system_menu WHERE route_name = 'System';

              INSERT OR IGNORE INTO system_role_menu (role_id, menu_id)
              SELECT r.id, m.id
              FROM system_role r
              JOIN system_menu m ON m.route_name = 'SystemOverview'
              WHERE r.role_code = 'ADMIN';

              INSERT OR IGNORE INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT id, 'GET', '/api/admin/role-menu-config'
              FROM system_permission WHERE permission_code = 'system:role-menu:manage';

              INSERT OR IGNORE INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT id, 'PUT', '/api/admin/role-menu-config/{roleId}'
              FROM system_permission WHERE permission_code = 'system:role-menu:manage';

              PRAGMA foreign_keys = ON;
