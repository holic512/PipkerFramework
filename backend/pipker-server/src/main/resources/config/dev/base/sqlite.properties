# @file config/dev/base/sqlite.properties
# @project Pipker Framework
# @module Pipker Server
# @description 开发环境 SQLite 数据源和共享 Liquibase XML 基线配置。
# @logic 仅在 sqlite Profile 下生效，数据库文件固定由 file.properties 中定义的 pipker.data.database-root 推导。
# @dependencies Spring Boot JDBC、SQLite JDBC、Liquibase
# @index_tags server、配置、properties、dev、base、sqlite、datasource、liquibase
# @author holic512
spring.config.activate.on-profile=sqlite
spring.datasource.url=jdbc:sqlite:${pipker.data.database-root}/pipker.db
spring.datasource.username=${PIPKER_DATABASE_USERNAME:}
spring.datasource.password=${PIPKER_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
