spring:
  datasource:
    url: jdbc:h2:mem:pipker_system;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=SYSTEM_USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

pipker:
  dev:
    route-manifest:
      enabled: false
