# @file db/changelog/pg/system/005-system-role-permission.yaml
# @project Pipker Framework
# @module Pipker Server
# @description PostgreSQL 角色权限关联表结构。
# @logic 创建角色与权限的多对多关联、主键和外键约束。
# @dependencies Liquibase、PostgreSQL JDBC、system_role、system_permission
# @index_tags liquibase、pg、postgresql、system_role_permission
# @author holic512
databaseChangeLog:
  - changeSet:
      id: 005-system-role-permission-create-table
      author: holic512
      changes:
        - createTable:
            tableName: system_role_permission
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: system_role_permission
            columnNames: role_id, permission_id
            constraintName: pk_system_role_permission
        - addForeignKeyConstraint:
            baseTableName: system_role_permission
            baseColumnNames: role_id
            constraintName: fk_system_role_permission_role
            referencedTableName: system_role
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: system_role_permission
            baseColumnNames: permission_id
            constraintName: fk_system_role_permission_permission
            referencedTableName: system_permission
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: system_role_permission
            indexName: idx_system_role_permission_permission_id
            columns:
              - column:
                  name: permission_id
