# @file db/changelog/mysql/system/009-system-database-rbac.yaml
# @project Pipker Framework
# @module Pipker Server
# @description MySQL RBAC 结构调整和 API 资源初始化。
# @logic 删除旧按钮权限和角色菜单关系，重建权限约束并初始化 API 资源。
# @dependencies Liquibase、MySQL Connector/J、system_permission、system_menu、system_role_permission
# @index_tags liquibase、mysql、rbac、api-resource、migration
# @author holic512
databaseChangeLog:
  - changeSet:
      id: 009-system-database-rbac-drop-menu-association
      author: holic512
      changes:
        - dropTable:
            tableName: system_role_menu

  - changeSet:
      id: 009-system-database-rbac-permission-and-menu-types
      author: holic512
      changes:
        - sql:
            dbms: mysql
            splitStatements: false
            sql: ALTER TABLE system_permission DROP CHECK ck_system_permission_type
        - delete:
            tableName: system_menu
            where: permission_code IN (SELECT permission_code FROM system_permission WHERE permission_type = 'BUTTON')
        - delete:
            tableName: system_menu
            where: menu_type = 'BUTTON'
        - delete:
            tableName: system_role_permission
            where: permission_id IN (SELECT id FROM system_permission WHERE permission_type = 'BUTTON')
        - delete:
            tableName: system_permission
            where: permission_type = 'BUTTON'
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_permission (permission_code, permission_name, permission_type, description, status, created_at, updated_at)
              SELECT 'system:overview:page', '访问系统概览', 'PAGE', '访问系统概览页面路由', 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (
                SELECT 1 FROM system_permission WHERE permission_code = 'system:overview:page'
              )
        - update:
            tableName: system_menu
            columns:
              - column:
                  name: permission_code
                  value: system:overview:page
            where: permission_code = 'system:menu:list'
        - delete:
            tableName: system_role_permission
            where: permission_id IN (SELECT id FROM system_permission WHERE permission_code = 'system:menu:list')
        - delete:
            tableName: system_permission
            where: permission_code = 'system:menu:list'
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_permission (permission_code, permission_name, permission_type, description, status, created_at, updated_at)
              SELECT 'system:auth:me', '读取当前授权信息', 'API', '读取当前登录用户的角色、权限和页面菜单', 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (
                SELECT 1 FROM system_permission WHERE permission_code = 'system:auth:me'
              )
        - delete:
            tableName: system_role_permission
            where: role_id IN (SELECT id FROM system_role WHERE role_code = 'SUPER_ADMIN')
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_role_permission (role_id, permission_id)
              SELECT r.id, p.id
              FROM system_role r
              JOIN system_permission p ON p.permission_code IN (
                'system:overview:page', 'system:auth:me', 'system:authorization:read'
              )
              WHERE r.role_code = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1
                  FROM system_role_permission rp
                  WHERE rp.role_id = r.id AND rp.permission_id = p.id
                )
        - sql:
            dbms: mysql
            splitStatements: false
            sql: ALTER TABLE system_permission ADD CONSTRAINT ck_system_permission_type CHECK (permission_type IN ('API', 'PAGE'))
        - sql:
            dbms: mysql
            splitStatements: false
            sql: ALTER TABLE system_menu ADD CONSTRAINT ck_system_menu_type CHECK (menu_type IN ('DIRECTORY', 'MENU'))

  - changeSet:
      id: 009-system-database-rbac-api-resource
      author: holic512
      changes:
        - createTable:
            tableName: system_api_resource
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_system_api_resource
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: path_pattern
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: system_api_resource
            columnNames: http_method, path_pattern
            constraintName: uk_system_api_resource_method_path
        - addForeignKeyConstraint:
            baseTableName: system_api_resource
            baseColumnNames: permission_id
            constraintName: fk_system_api_resource_permission
            referencedTableName: system_permission
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: system_api_resource
            indexName: idx_system_api_resource_permission_id
            columns:
              - column:
                  name: permission_id

  - changeSet:
      id: 009-system-database-rbac-api-resource-seed
      author: holic512
      changes:
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT p.id, 'GET', '/api/auth/me'
              FROM system_permission p
              WHERE p.permission_code = 'system:auth:me'
                AND NOT EXISTS (
                  SELECT 1 FROM system_api_resource r
                  WHERE r.http_method = 'GET' AND r.path_pattern = '/api/auth/me'
                )
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT p.id, 'GET', '/api/admin/authorization'
              FROM system_permission p
              WHERE p.permission_code = 'system:authorization:read'
                AND NOT EXISTS (
                  SELECT 1 FROM system_api_resource r
                  WHERE r.http_method = 'GET' AND r.path_pattern = '/api/admin/authorization'
                )
