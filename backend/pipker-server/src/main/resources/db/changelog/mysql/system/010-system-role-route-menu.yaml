# @file db/changelog/mysql/system/010-system-role-route-menu.yaml
# @project Pipker Framework
# @module Pipker Server
# @description MySQL 角色路由菜单授权结构调整。
# @logic 恢复角色菜单关联，移除页面权限模型并初始化角色路由管理资源。
# @dependencies Liquibase、MySQL Connector/J、system_permission、system_menu、system_role_menu
# @index_tags liquibase、mysql、rbac、role-menu、migration
# @author holic512
databaseChangeLog:
  - changeSet:
      id: 010-system-role-route-menu-create-association
      author: holic512
      changes:
        - createTable:
            tableName: system_role_menu
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: menu_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: system_role_menu
            columnNames: role_id, menu_id
            constraintName: pk_system_role_menu
        - addForeignKeyConstraint:
            baseTableName: system_role_menu
            baseColumnNames: role_id
            constraintName: fk_system_role_menu_role
            referencedTableName: system_role
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: system_role_menu
            baseColumnNames: menu_id
            constraintName: fk_system_role_menu_menu
            referencedTableName: system_menu
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: system_role_menu
            indexName: idx_system_role_menu_menu_id
            columns:
              - column:
                  name: menu_id

  - changeSet:
      id: 010-system-role-route-menu-remove-page-permission
      author: holic512
      changes:
        - delete:
            tableName: system_role_permission
            where: permission_id IN (SELECT id FROM system_permission WHERE permission_type = 'PAGE')
        - dropForeignKeyConstraint:
            baseTableName: system_menu
            constraintName: fk_system_menu_permission_code
        - dropColumn:
            tableName: system_menu
            columnName: permission_code
        - delete:
            tableName: system_permission
            where: permission_type = 'PAGE'
        - sql:
            dbms: mysql
            splitStatements: false
            sql: ALTER TABLE system_permission DROP CHECK ck_system_permission_type
        - sql:
            dbms: mysql
            splitStatements: false
            sql: ALTER TABLE system_permission ADD CONSTRAINT ck_system_permission_type CHECK (permission_type = 'API')

  - changeSet:
      id: 010-system-role-route-menu-seed-configuration
      author: holic512
      changes:
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_permission (permission_code, permission_name, permission_type, description, status, created_at, updated_at)
              SELECT 'system:role-menu:manage', '管理角色路由菜单', 'API', '读取和保存角色可访问页面菜单', 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (
                SELECT 1 FROM system_permission WHERE permission_code = 'system:role-menu:manage'
              )
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_menu (parent_id, menu_name, menu_type, route_path, route_name, component_key, icon, sort, visible, status, created_at, updated_at)
              SELECT id, '角色路由', 'MENU', '/system/role-menu', 'SystemRoleMenu', 'system/role-menu/index', 'Share', 20, TRUE, 'ENABLED', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM system_menu
              WHERE route_name = 'System'
                AND NOT EXISTS (
                  SELECT 1 FROM system_menu WHERE route_name = 'SystemRoleMenu'
                )
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_role_menu (role_id, menu_id)
              SELECT r.id, m.id
              FROM system_role r
              JOIN system_menu m ON m.route_name = 'SystemOverview'
              WHERE r.role_code = 'ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM system_role_menu rm WHERE rm.role_id = r.id AND rm.menu_id = m.id
                )
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT p.id, 'GET', '/api/admin/role-menu-config'
              FROM system_permission p
              WHERE p.permission_code = 'system:role-menu:manage'
                AND NOT EXISTS (
                  SELECT 1 FROM system_api_resource r
                  WHERE r.http_method = 'GET' AND r.path_pattern = '/api/admin/role-menu-config'
                )
        - sql:
            splitStatements: false
            sql: |
              INSERT INTO system_api_resource (permission_id, http_method, path_pattern)
              SELECT p.id, 'PUT', '/api/admin/role-menu-config/{roleId}'
              FROM system_permission p
              WHERE p.permission_code = 'system:role-menu:manage'
                AND NOT EXISTS (
                  SELECT 1 FROM system_api_resource r
                  WHERE r.http_method = 'PUT' AND r.path_pattern = '/api/admin/role-menu-config/{roleId}'
                )
