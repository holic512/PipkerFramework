# 文件：application-redis.yml
# 项目：Pipker Framework
# 模块：Pipker Server
# 说明：使用 Spring Data Redis 连接覆盖默认的 Sa-Token 内存会话存储。
# 处理逻辑：仅在 redis profile 下加载；连接配置使用直接 Spring YAML 属性。
# 依赖：Spring Boot Data Redis、Pipker Sa-Token Starter
# 检索关键词：server、配置、redis、sa-token、profile
# 作者：holic512
spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      username:
      password:

pipker:
  security:
    auth:
      session-store: redis
