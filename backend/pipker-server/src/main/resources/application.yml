# 文件：application.yml
# 项目：Pipker Framework
# 模块：Pipker Server
# 说明：定义默认 Server 运行时、Bearer 令牌、内存会话和当前加密算法配置。
# 处理逻辑：通过 profile 保持 Redis 可选，使用 Sa-Token 保护 API 路由，并要求从环境变量提供所选字段加密算法所需的密钥材料。
# 依赖：Spring Boot、Pipker Sa-Token Starter、Pipker Security Starter
# 检索关键词：server、配置、sa-token、安全、加密
# 作者：holic512
spring:
  application:
    name: pipker-server

server:
  port: 8080

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
  is-print: false

pipker:
  security:
    auth:
      session-store: memory
      protected-paths:
        - /api/**
      public-routes:
        - GET /api/ping
    crypto:
      password:
        algorithm: bcrypt
        bcrypt-strength: 12
        pbkdf2-iterations: 600000
        pbkdf2-salt-length: 16
        pbkdf2-hash-width: 256
      encryption:
        algorithm: aes-gcm
        aes-gcm-key: ${PIPKER_SECURITY_AES_GCM_KEY:}
        rsa-oaep-public-key: ${PIPKER_SECURITY_RSA_OAEP_PUBLIC_KEY:}
        rsa-oaep-private-key: ${PIPKER_SECURITY_RSA_OAEP_PRIVATE_KEY:}
