# @file config/dev/base/mysql.properties
# @project Pipker Framework
# @module Pipker Server
# @description 开发环境 MySQL 数据源配置。
# @logic 仅在 mysql Profile 下生效，连接参数由外部环境变量提供，并加载跨数据库共享的 Liquibase XML 基线。
# @dependencies Spring Boot JDBC、MySQL Connector/J、Liquibase
# @index_tags server、配置、properties、dev、base、mysql、datasource、liquibase
# @author holic512
spring.config.activate.on-profile=mysql
spring.datasource.url=${PIPKER_DATABASE_URL:}
spring.datasource.username=${PIPKER_DATABASE_USERNAME:}
spring.datasource.password=${PIPKER_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
