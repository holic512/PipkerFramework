# @file config/dev/file.properties
# @project Pipker Framework
# @module Pipker Server
# @description 开发环境统一维护本地文件、日志和 SQLite 数据库的持久化目录配置。
# @logic 三类目录独立配置；文件和日志路径对所有数据库 Profile 生效，SQLite Profile 才会消费 database-root 创建和访问本地数据库。
# @dependencies Spring Boot Config Data、Pipker File Starter、SQLite JDBC
# @index_tags server、配置、properties、dev、file-storage、log、sqlite、persistence-path
# @author holic512

# 是否启用默认本地文件存储服务和 /files/** 的 MVC 访问映射。
pipker.file.enabled=${PIPKER_FILE_ENABLED:true}

# 应用日志持久化目录；启动阶段会创建并校验该目录。
pipker.data.log-root=${PIPKER_LOG_ROOT:./data/log}
# 本地 SQLite 数据库目录；仅 sqlite Profile 会实际消费该字段。
pipker.data.database-root=${PIPKER_SQLITE_ROOT:./data/base}
# 文件实际落盘目录；由文件存储模块直接绑定和使用。
pipker.file.local.root=${PIPKER_FILE_ROOT:./data/file}

# 文件对外访问的相对 URL 前缀，不包含域名、协议或端口。
pipker.file.access-path=${PIPKER_FILE_ACCESS_PATH:/files}
