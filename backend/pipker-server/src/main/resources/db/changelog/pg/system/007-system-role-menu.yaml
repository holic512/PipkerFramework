# @file db/changelog/pg/system/007-system-role-menu.yaml
# @project Pipker Framework
# @module Pipker Server
# @description PostgreSQL 角色菜单关联表结构。
# @logic 创建角色与菜单的多对多关联、主键和外键约束。
# @dependencies Liquibase、PostgreSQL JDBC、system_role、system_menu
# @index_tags liquibase、pg、postgresql、system_role_menu
# @author holic512
databaseChangeLog:
  - changeSet:
      id: 007-system-role-menu-create-table
      author: holic512
      changes:
        - createTable:
            tableName: system_role_menu
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: menu_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: system_role_menu
            columnNames: role_id, menu_id
            constraintName: pk_system_role_menu
        - addForeignKeyConstraint:
            baseTableName: system_role_menu
            baseColumnNames: role_id
            constraintName: fk_system_role_menu_role
            referencedTableName: system_role
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: system_role_menu
            baseColumnNames: menu_id
            constraintName: fk_system_role_menu_menu
            referencedTableName: system_menu
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: system_role_menu
            indexName: idx_system_role_menu_menu_id
            columns:
              - column:
                  name: menu_id
