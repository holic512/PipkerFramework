databaseChangeLog:
  - changeSet:
      id: 004-system-permission-create-table
      author: holic512
      changes:
        - createTable:
            tableName: system_permission
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_system_permission
                    nullable: false
              - column:
                  name: permission_code
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: permission_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: permission_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: ENABLED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: system_permission
            columnNames: permission_code
            constraintName: uk_system_permission_code
        - sql:
            splitStatements: false
            sql: ALTER TABLE system_permission ADD CONSTRAINT ck_system_permission_type CHECK (permission_type IN ('API', 'BUTTON'))
