# @file application-dev.properties
# @project Pipker Framework
# @module Pipker Server
# @description 开发环境配置入口。
# @logic 当 dev Profile 生效时，导入开发环境的持久化路径、数据库和 Redis 配置；数据库文件仅在对应 Profile 生效时参与合并。
# @dependencies Spring Boot Config Data
# @index_tags server、配置、properties、dev、profile、import
# @author holic512
spring.config.import[0]=classpath:/config/dev/file.properties
spring.config.import[1]=classpath:/config/dev/base/sqlite.properties
spring.config.import[2]=classpath:/config/dev/base/mysql.properties
spring.config.import[3]=classpath:/config/dev/base/pg.properties
spring.config.import[4]=classpath:/config/dev/redis.properties
