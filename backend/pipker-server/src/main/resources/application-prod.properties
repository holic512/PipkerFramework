# @file application-prod.properties
# @project Pipker Framework
# @module Pipker Server
# @description 生产环境配置入口。
# @logic 当 prod Profile 生效时，导入生产环境的持久化路径、数据库和 Redis 配置；数据库必须同时显式选择，并仅合并对应 Profile 的配置。
# @dependencies Spring Boot Config Data
# @index_tags server、配置、properties、prod、profile、import
# @author holic512
spring.config.import[0]=classpath:/config/prod/file.properties
spring.config.import[1]=classpath:/config/prod/base/sqlite.properties
spring.config.import[2]=classpath:/config/prod/base/mysql.properties
spring.config.import[3]=classpath:/config/prod/base/pg.properties
spring.config.import[4]=classpath:/config/prod/redis.properties
