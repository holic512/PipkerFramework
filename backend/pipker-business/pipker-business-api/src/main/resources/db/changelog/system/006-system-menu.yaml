databaseChangeLog:
  - changeSet:
      id: 006-system-menu-create-table
      author: holic512
      changes:
        - createTable:
            tableName: system_menu
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_system_menu
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: menu_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: menu_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: route_path
                  type: VARCHAR(255)
              - column:
                  name: route_name
                  type: VARCHAR(100)
              - column:
                  name: component_key
                  type: VARCHAR(255)
              - column:
                  name: icon
                  type: VARCHAR(100)
              - column:
                  name: sort
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: visible
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: ENABLED
                  constraints:
                    nullable: false
              - column:
                  name: permission_code
                  type: VARCHAR(128)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: system_menu
            columnNames: route_path
            constraintName: uk_system_menu_route_path
        - addUniqueConstraint:
            tableName: system_menu
            columnNames: route_name
            constraintName: uk_system_menu_route_name
        - addForeignKeyConstraint:
            baseTableName: system_menu
            baseColumnNames: parent_id
            constraintName: fk_system_menu_parent
            referencedTableName: system_menu
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: system_menu
            baseColumnNames: permission_code
            constraintName: fk_system_menu_permission_code
            referencedTableName: system_permission
            referencedColumnNames: permission_code
        - createIndex:
            tableName: system_menu
            indexName: idx_system_menu_parent_id
            columns:
              - column:
                  name: parent_id
