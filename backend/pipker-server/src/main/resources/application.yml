# 文件：application.yml
# 项目：Pipker Framework
# 模块：Pipker Server
# 说明：定义默认 Server 运行时、数据库迁移、Bearer 令牌和当前加密算法配置。
# 处理逻辑：默认选择 MySQL Profile；使用 Sa-Token 保护 API 路由，并由 Liquibase 初始化框架系统表。
# 依赖：Spring Boot、Liquibase、Pipker Sa-Token Starter、Pipker Security Starter
# 检索关键词：server、配置、liquibase、sa-token、安全、加密
# 作者：holic512
spring:
  application:
    name: pipker-server
  profiles:
    default: mysql
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: random-128
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
  is-print: false

pipker:
  security:
    auth:
      session-store: memory
      protected-paths:
        - /api/**
      public-routes:
        - GET /api/ping
        - POST /api/auth/login
        - GET /api/_dev/routes
    crypto:
      password:
        algorithm: bcrypt
        bcrypt-strength: 12
        pbkdf2-iterations: 600000
        pbkdf2-salt-length: 16
        pbkdf2-hash-width: 256
      encryption:
        algorithm: aes-gcm
        aes-gcm-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        rsa-oaep-public-key:
        rsa-oaep-private-key:
  dev:
    route-manifest:
      enabled: false
