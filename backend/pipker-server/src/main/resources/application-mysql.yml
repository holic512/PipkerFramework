# 文件：application-mysql.yml
# 项目：Pipker Framework
# 模块：Pipker Server
# 说明：定义 MySQL 作为框架系统表长期存储目标时的直接数据源配置。
# 处理逻辑：使用者在首次初始化前填写 URL、用户名和密码；Liquibase 随 Server 启动执行 system_ 表迁移。
# 依赖：Spring JDBC、MySQL Connector/J、Liquibase
# 检索关键词：mysql、datasource、liquibase、system
# 作者：holic512
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url:
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
