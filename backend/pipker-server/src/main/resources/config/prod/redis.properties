# @file config/prod/redis.properties
# @project Pipker Framework
# @module Pipker Server
# @description 生产环境 Redis 连接和会话存储配置。
# @logic 仅在 redis Profile 下生效；生产环境可通过环境变量或后续环境配置覆盖连接参数。
# @dependencies Spring Boot Data Redis、Pipker Sa-Token Starter
# @index_tags server、配置、properties、prod、redis、sa-token、profile
# @author holic512
spring.config.activate.on-profile=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.username=
spring.data.redis.password=
pipker.security.auth.session-store=redis
