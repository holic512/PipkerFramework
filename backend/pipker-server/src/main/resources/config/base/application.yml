# @file config/base/application.yml
# @project Pipker Framework
# @module Pipker Server
# @description 统一基础设施配置入口。
# @logic 导入所有可选数据库实现及本地文件存储默认配置，由数据库 Profile 决定实际数据源，文件功能由 pipker.file.enabled 控制。
# @dependencies Spring Boot Config Data、SQLite JDBC、MySQL Connector/J、PostgreSQL JDBC、Pipker File Starter
# @index_tags server、配置、base、database、datasource、file-storage、profile
# @author holic512
spring:
  config:
    import:
      - classpath:/config/base/database/sqlite.yml
      - classpath:/config/base/database/mysql.yml
      - classpath:/config/base/database/postgresql.yml
      - classpath:/config/base/file.yml
