# @file application.properties
# @project Pipker Framework
# @module Pipker Server
# @description 定义 Server 的公共运行时配置和默认环境。
# @logic 无显式 Profile 时使用 dev 与 sqlite；各环境 Profile 文件分别导入本环境的持久化路径、数据库和 Redis 配置。
# @dependencies Spring Boot、MyBatis-Plus、Liquibase、Pipker Sa-Token Starter、Pipker Security Starter
# @index_tags server、配置、properties、profile、mybatis-plus、liquibase、sa-token、安全、加密
# @author holic512
spring.application.name=pipker-server
spring.profiles.default=dev,sqlite

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

server.port=8080

sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.timeout=604800
sa-token.active-timeout=1800
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=random-128
sa-token.is-read-header=true
sa-token.is-read-body=false
sa-token.is-read-cookie=false
sa-token.is-log=false
sa-token.is-print=false

pipker.security.auth.session-store=memory
pipker.security.auth.protected-paths[0]=/api/**
pipker.security.auth.public-routes[0]=GET /api/ping
pipker.security.auth.public-routes[1]=POST /api/auth/login
# Sa-Token 继续负责 /api/** 登录校验；接口权限由 MVC 的 @Permission 注解拦截器统一处理。
pipker.security.auth.database-authorization-required=false
pipker.security.auth.authorization-cache-ttl=60s
pipker.security.auth.authorization-cache-maximum-size=10000
pipker.security.auth.role-permission-cache-refresh-interval=5m
pipker.security.crypto.password.algorithm=bcrypt
pipker.security.crypto.password.bcrypt-strength=12
pipker.security.crypto.password.pbkdf2-iterations=600000
pipker.security.crypto.password.pbkdf2-salt-length=16
pipker.security.crypto.password.pbkdf2-hash-width=256
pipker.security.crypto.encryption.algorithm=aes-gcm
pipker.security.crypto.encryption.aes-gcm-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
pipker.security.crypto.encryption.rsa-oaep-public-key=
pipker.security.crypto.encryption.rsa-oaep-private-key=
